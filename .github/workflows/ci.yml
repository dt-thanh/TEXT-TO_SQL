# Continuous integration: every push and pull request to main runs the checks that need no
# secret and cost nothing. Integration tests and the LLM benchmark stay local: they need the
# Snowflake keys and an OpenAI key, and every run of the benchmark costs money.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  python:
    name: Lint, unit tests, dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (no network, no credentials)
        run: pytest tests/unit
      - name: dbt project parses (SQL, Jinja, refs, tests)
        working-directory: dbt
        # profiles.yml reads these; parsing never connects, so placeholders are enough.
        env:
          SNOWFLAKE_ACCOUNT: ci-placeholder
          SNOWFLAKE_USER: ci
          SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
          SNOWFLAKE_ROLE: FINSIGHT_ENGINEER
          SNOWFLAKE_WAREHOUSE: FINSIGHT_WH
          SNOWFLAKE_DATABASE: FINSIGHT
        run: dbt deps && dbt parse

  dags:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # The same Airflow as airflow/Dockerfile, with Airflow's own tested version pins.
      - name: Install Airflow
        run: >-
          pip install "apache-airflow==3.3.2" pytest
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.11.txt
      - name: Parse the DAGs
        run: pytest tests/dags

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the API/UI image
        run: docker build -t finsight-app:ci .
      # Catches files the image forgets to copy (they only fail when the first request comes),
      # by loading every runtime file and calling /health inside the container.
      - name: Smoke test inside the image
        run: >-
          docker run --rm finsight-app:ci python -c
          "from fastapi.testclient import TestClient;
          from src.main import app;
          from src.semantic.layer import load_semantic_layer;
          from src.agents.sql_generation import system_prompt;
          load_semantic_layer(); system_prompt();
          assert TestClient(app).get('/health').json() == {'status': 'ok'};
          print('image OK')"
