# Third-party dbt packages, installed into dbt_packages/ by `make dbt-deps`.
# dbt_utils gives ready-made tests we need: unique_combination_of_columns (multi-column grain)
# and expression_is_true (row rules such as high_price >= low_price).
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]
