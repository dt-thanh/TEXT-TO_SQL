# Documentation and tests for MART (spec §11). These descriptions are also what the Text-to-SQL
# agent reads (persist_docs → Snowflake COMMENTs), so they say what each metric MEANS.
# Every column is described; shared wording lives once in _docs.md ({{ doc('...') }}), and
# dbt/tests/mart_columns_are_documented.sql fails the build if a MART column has no comment.
version: 2

models:
  - name: mart_asset_daily
    description: >
      One row per asset per finished UTC day. Daily OHLCV built from hourly candles, plus
      daily return, log return and 30-day annualized volatility.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trade_date, symbol]
      - dbt_utils.expression_is_true:
          name: mart_asset_daily_candle_count_is_1_to_24
          arguments:
            expression: "candle_count between 1 and 24"
      - dbt_utils.expression_is_true:
          name: mart_asset_daily_price_cannot_drop_below_zero
          arguments:
            expression: "daily_return > -1"
      - dbt_utils.expression_is_true:
          name: mart_asset_daily_volatility_is_not_negative
          arguments:
            expression: "volatility_30d >= 0"
    columns:
      - name: trade_date
        description: "{{ doc('trade_date') }}"
        data_tests:
          - not_null
          # No missing day per asset, so "previous row" in the return formula is "previous day".
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
                group_by_columns: [symbol]
      - name: symbol
        description: "{{ doc('symbol') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: symbol
      - name: open_price
        description: "{{ doc('open_price') }}"
      - name: high_price
        description: "{{ doc('high_price') }}"
      - name: low_price
        description: "{{ doc('low_price') }}"
      - name: close_price
        description: "{{ doc('close_price') }}"
        data_tests: [not_null]
      - name: base_volume
        description: "{{ doc('base_volume') }}"
      - name: quote_volume
        description: "{{ doc('quote_volume') }}"
      - name: trade_count
        description: "{{ doc('trade_count') }}"
      - name: candle_count
        description: "{{ doc('candle_count') }}"
      - name: is_complete_day
        description: "{{ doc('is_complete_day') }}"
      - name: daily_return
        description: "{{ doc('daily_return') }}"
      - name: log_return
        description: "{{ doc('log_return') }}"
      - name: volatility_30d
        description: "{{ doc('volatility_30d') }}"

  - name: mart_macro_daily
    description: >
      One row per calendar day (weekends included) with the Fed Funds rate, the 10-year
      Treasury yield and CPI inflation an analyst could know that day: the newest value already
      published, never a value published later (no look-ahead bias).
    data_tests:
      - dbt_utils.expression_is_true:
          name: mart_macro_daily_uses_only_published_values
          arguments:
            expression: >
              fed_rate_available_date <= market_date
              and treasury_10y_available_date <= market_date
              and cpi_release_date <= market_date
      - dbt_utils.expression_is_true:
          name: mart_macro_daily_treasury_value_is_recent
          arguments:
            expression: "treasury_10y_days_since_observation <= 7"
          config:
            severity: warn
    columns:
      - name: market_date
        description: Calendar day the values were known on.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: fed_funds_rate
        description: "{{ doc('fed_funds_rate') }}"
        data_tests: [not_null]
      - name: fed_rate_source_date
        description: "{{ doc('fed_rate_source_date') }}"
      - name: fed_rate_available_date
        description: "{{ doc('fed_rate_available_date') }}"
      - name: fed_rate_days_since_observation
        description: "{{ doc('days_since_observation') }}"
      - name: fed_rate_is_carried_forward
        description: "{{ doc('is_carried_forward') }}"
      - name: treasury_10y
        description: "{{ doc('treasury_10y') }}"
        data_tests: [not_null]
      - name: treasury_10y_source_date
        description: "{{ doc('treasury_10y_source_date') }}"
      - name: treasury_10y_available_date
        description: "{{ doc('treasury_10y_available_date') }}"
      - name: treasury_10y_days_since_observation
        description: "{{ doc('days_since_observation') }}"
      - name: treasury_10y_is_carried_forward
        description: "{{ doc('is_carried_forward') }}"
      - name: treasury_10y_change_bps
        description: "{{ doc('treasury_10y_change_bps') }}"
      - name: cpi_month
        description: "{{ doc('cpi_month') }}"
        data_tests: [not_null]
      - name: cpi_release_date
        description: "{{ doc('cpi_release_date') }}"
      - name: cpi_yoy_change
        description: "{{ doc('cpi_yoy_change') }}"
        data_tests: [not_null]
      - name: cpi_mom_change
        description: "{{ doc('cpi_mom_change') }}"

  - name: mart_cpi_monthly
    description: >
      One row per US CPI month (CPIAUCSL, seasonally adjusted) as FIRST published, with the
      month-over-month and year-over-year changes an analyst could compute on the release date,
      and today's revised value for comparison.
    data_tests:
      - dbt_utils.expression_is_true:
          name: mart_cpi_monthly_is_published_after_the_month
          arguments:
            expression: "release_date > cpi_month"
      # A published value needs its base months as known on its release date, or a change is
      # NULL. It warns instead of failing: a base month the source never published (October
      # 2025, US government shutdown) leaves a change NULL, and that is the honest answer.
      - dbt_utils.expression_is_true:
          name: mart_cpi_monthly_changes_are_computed
          arguments:
            expression: "cpi_index is null or (cpi_mom_change is not null and cpi_yoy_change is not null)"
          config:
            severity: warn
    columns:
      - name: cpi_month
        description: First day of the CPI month.
        data_tests:
          - unique
          - not_null
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: month
      - name: release_date
        description: The day FRED first published the month.
      - name: cpi_index
        description: CPI index level as first published (1982-84 = 100). NULL when the month was published without a value (October 2025, US government shutdown).
      - name: cpi_mom_change
        description: "{{ doc('cpi_mom_change') }}"
      - name: cpi_yoy_change
        description: "{{ doc('cpi_yoy_change') }}"
      - name: latest_cpi_index
        description: The same month's CPI as known today, after revisions.
      - name: is_revised
        description: True when today's value differs from the first publication.

  - name: mart_chain_tvl_daily
    description: >
      One row per DefiLlama chain per finished UTC day: DeFi total value locked (TVL) and its
      1-day and 7-day change. Values are DefiLlama's current view of each day; is_retrospective
      marks those not available at the time (historical backfill or later revision).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tvl_date, chain]
      - dbt_utils.expression_is_true:
          name: mart_chain_tvl_daily_tvl_cannot_drop_below_zero
          arguments:
            expression: "tvl_change_7d > -1 and tvl_change_1d > -1"
    columns:
      - name: tvl_date
        description: UTC day of the TVL point (DefiLlama's 00:00 UTC value).
        data_tests:
          - not_null
          # A missing day only makes the change columns NULL, so it warns instead of failing.
          - dbt_utils.sequential_values:
              arguments:
                interval: 1
                datepart: day
                group_by_columns: [chain]
              config:
                severity: warn
      - name: chain
        description: "{{ doc('chain') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_chain')
                field: chain_slug
      - name: related_symbol
        description: Binance pair of the chain's native asset (e.g. ETHUSDT for Ethereum); NULL for "All".
      - name: tvl_usd
        description: "{{ doc('tvl_usd') }}"
        data_tests: [not_null]
      - name: tvl_change_1d
        description: "{{ doc('tvl_change_1d') }}"
      - name: tvl_change_7d
        description: "{{ doc('tvl_change_7d') }}"
      - name: fetched_date
        description: "{{ doc('fetched_date') }}"
      - name: is_retrospective
        description: "{{ doc('is_retrospective') }}"

  - name: mart_market_macro_daily
    description: >
      Main analytics table: one row per asset per day with its return and volatility next to
      the Fed Funds rate, 10-year Treasury yield and CPI inflation known that day, and DeFi TVL
      on the asset's chain and on all chains.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trade_date, symbol]
      # The joins must not multiply rows (fan-out: one asset-day joined to several macro or TVL rows).
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('mart_asset_daily')
    columns:
      - name: trade_date
        description: "{{ doc('trade_date') }}"
      - name: symbol
        description: "{{ doc('symbol') }}"
      - name: close_price
        description: "{{ doc('close_price') }}"
      - name: daily_return
        description: "{{ doc('daily_return') }}"
      - name: log_return
        description: "{{ doc('log_return') }}"
      - name: volatility_30d
        description: "{{ doc('volatility_30d') }}"
      - name: base_volume
        description: "{{ doc('base_volume') }}"
      - name: quote_volume
        description: "{{ doc('quote_volume') }}"
      - name: fed_funds_rate
        description: "{{ doc('fed_funds_rate') }}"
        data_tests: [not_null]
      - name: fed_rate_source_date
        description: "{{ doc('fed_rate_source_date') }}"
      - name: treasury_10y
        description: "{{ doc('treasury_10y') }}"
        data_tests: [not_null]
      - name: treasury_10y_source_date
        description: "{{ doc('treasury_10y_source_date') }}"
      - name: treasury_10y_change_bps
        description: "{{ doc('treasury_10y_change_bps') }}"
      - name: cpi_month
        description: "{{ doc('cpi_month') }}"
      - name: cpi_yoy_change
        description: "{{ doc('cpi_yoy_change') }}"
      - name: chain
        description: The DefiLlama chain of the asset (Ethereum, Solana, BSC, Bitcoin).
      - name: chain_tvl_usd
        description: "{{ doc('chain_tvl_usd') }}"
      - name: chain_tvl_change_7d
        description: "{{ doc('tvl_change_7d') }}"
      - name: defi_tvl_usd
        description: "{{ doc('defi_tvl_usd') }}"
      - name: defi_tvl_change_7d
        description: "{{ doc('tvl_change_7d') }}"

  - name: mart_asset_universe
    description: >
      Every crypto asset in the data, one row each: the four core assets and the coins the owner
      added. Use it to know which symbols exist and from when; prices are in MART_ASSET_DAILY.
    columns:
      - name: symbol
        description: "{{ doc('symbol') }}"
        data_tests: [unique, not_null]
      - name: asset_key
        description: The coin's identity, exchange:baseAsset (e.g. BINANCE:ETH).
        data_tests: [unique, not_null]
      - name: base_asset
        description: The coin's ticker on Binance (ETH for ETHUSDT).
      - name: display_name
        description: The asset's name (Ethereum); the ticker for added coins.
      - name: is_core
        description: True for the four assets with history since 2019 (BTC, ETH, SOL, BNB).
      - name: chain_slug
        description: The DefiLlama chain whose TVL belongs to this asset; NULL when none is mapped.
      - name: data_from
        description: First UTC day with a daily row.
      - name: data_through
        description: Newest finished UTC day with a daily row.
      - name: n_days
        description: Number of days with a daily row.
      - name: status
        description: ready (has daily data), loading (added, not loaded yet) or disabled.
        data_tests:
          - accepted_values:
              arguments:
                values: [ready, loading, disabled]

  - name: mart_risk_signal_daily
    description: >
      Risk signals by fixed rules, one row per asset, day and signal when the signal fired.
      Signals describe past data; they are not forecasts or advice. Rules: risk_signal_rules seed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trade_date, symbol, signal_id]
    columns:
      - name: trade_date
        description: "{{ doc('trade_date') }}"
        data_tests: [not_null]
      - name: symbol
        description: "{{ doc('symbol') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_asset')
                field: symbol
      - name: signal_id
        description: abnormal_move, volatility_spike, drawdown_alert or tvl_drop.
        data_tests:
          - accepted_values:
              arguments:
                values: [abnormal_move, volatility_spike, drawdown_alert, tvl_drop]
      - name: signal_name
        description: Readable name of the rule.
      - name: value
        description: The rule's value that day, in `unit` (sigma, ratio or fraction).
      - name: threshold
        description: The rule's threshold; the signal fired because value compared to it as `comparison` says.
      - name: comparison
        description: ">= or <=."
      - name: unit
        description: sigma (standard deviations), ratio, or fraction (-0.2 = -20%).
      - name: window_days
        description: Calendar days the rule looked back.
      - name: n_obs
        description: "Observations in the window (for tvl_drop: days of TVL history so far)."
      - name: is_retrospective
        description: For tvl_drop, true when the TVL value was not available at the time (backfill or revision); NULL for the other signals.

unit_tests:
  # Small windows (3 days, 2 observations) through a mocked rules seed, so each case is a few rows.
  - name: risk_signals_fire_at_the_threshold_and_not_below
    description: "RISK-02: a drawdown of exactly -20% fires (<=); -19% does not."
    model: mart_risk_signal_daily
    given:
      - input: ref('risk_signal_rules')
        rows:
          - {signal_id: drawdown_alert, signal_name: Drawdown alert, unit: fraction, comparison: "<=", threshold: -0.2, window_days: 3, min_observations: 2}
      - input: ref('mart_asset_daily')
        rows:
          - {trade_date: 2025-01-01, symbol: AAAUSDT, close_price: 100}
          - {trade_date: 2025-01-02, symbol: AAAUSDT, close_price: 80}
          - {trade_date: 2025-01-01, symbol: BBBUSDT, close_price: 100}
          - {trade_date: 2025-01-02, symbol: BBBUSDT, close_price: 81}
      - input: ref('mart_chain_tvl_daily')
        rows: []
    expect:
      rows:
        - {trade_date: 2025-01-02, symbol: AAAUSDT, signal_id: drawdown_alert, value: -0.2, n_obs: 2}

  - name: risk_signals_need_enough_observations
    description: "RISK-03: a newly listed asset with one day of history gets no signal and no made-up value."
    model: mart_risk_signal_daily
    given:
      - input: ref('risk_signal_rules')
        rows:
          - {signal_id: drawdown_alert, signal_name: Drawdown alert, unit: fraction, comparison: "<=", threshold: -0.2, window_days: 3, min_observations: 2}
      - input: ref('mart_asset_daily')
        rows:
          - {trade_date: 2025-01-02, symbol: NEWUSDT, close_price: 50}
      - input: ref('mart_chain_tvl_daily')
        rows: []
    expect:
      rows: []

  - name: abnormal_move_uses_only_days_before_the_signal_day
    description: >
      RISK-01/RISK-04: the standard deviation comes from the 3 days BEFORE the day. Past returns
      0.01, -0.01, 0.01 have sample sd 0.011547; a 0.04 move is 3.464 sd (fires), 0.03 is 2.598.
      Day 5 returns to normal: its window contains the 0.04 move, which must not fire day 5.
    model: mart_risk_signal_daily
    given:
      - input: ref('risk_signal_rules')
        rows:
          - {signal_id: abnormal_move, signal_name: Abnormal daily move, unit: sigma, comparison: ">=", threshold: 3, window_days: 3, min_observations: 3}
      - input: ref('mart_asset_daily')
        rows:
          - {trade_date: 2025-01-01, symbol: AAAUSDT, daily_return: 0.01}
          - {trade_date: 2025-01-02, symbol: AAAUSDT, daily_return: -0.01}
          - {trade_date: 2025-01-03, symbol: AAAUSDT, daily_return: 0.01}
          - {trade_date: 2025-01-04, symbol: AAAUSDT, daily_return: 0.04}
          - {trade_date: 2025-01-05, symbol: AAAUSDT, daily_return: 0.01}
          - {trade_date: 2025-01-01, symbol: BBBUSDT, daily_return: 0.01}
          - {trade_date: 2025-01-02, symbol: BBBUSDT, daily_return: -0.01}
          - {trade_date: 2025-01-03, symbol: BBBUSDT, daily_return: 0.01}
          - {trade_date: 2025-01-04, symbol: BBBUSDT, daily_return: 0.03}
      - input: ref('mart_chain_tvl_daily')
        rows: []
    expect:
      rows:
        - {trade_date: 2025-01-04, symbol: AAAUSDT, signal_id: abnormal_move, n_obs: 3}

  - name: tvl_drop_only_for_mapped_chains
    description: "DYN-08: TVL of a chain without an asset (All) never becomes an asset signal."
    model: mart_risk_signal_daily
    given:
      - input: ref('risk_signal_rules')
        rows:
          - {signal_id: tvl_drop, signal_name: Chain TVL drop, unit: fraction, comparison: "<=", threshold: -0.15, window_days: 30, min_observations: 1}
      - input: ref('mart_asset_daily')
        rows: []
      - input: ref('mart_chain_tvl_daily')
        rows:
          - {tvl_date: 2025-01-08, chain: Ethereum, related_symbol: ETHUSDT, tvl_change_7d: -0.2, is_retrospective: true}
          - {tvl_date: 2025-01-08, chain: All, related_symbol: null, tvl_change_7d: -0.3, is_retrospective: true}
    expect:
      rows:
        - {trade_date: 2025-01-08, symbol: ETHUSDT, signal_id: tvl_drop, value: -0.2, is_retrospective: true}
