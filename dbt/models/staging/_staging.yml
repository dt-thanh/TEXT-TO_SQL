# Documentation and data tests for the staging models (spec §18).
# Each test is a query that returns the rows breaking a rule; zero rows = pass.
# "warn" tests flag known, accepted source quirks without failing the build.
version: 2

models:
  - name: stg_binance_kline
    description: Binance 1h candles in UTC, one row per symbol + interval_code + open_time.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, interval_code, open_time]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "high_price >= low_price"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "high_price >= greatest(open_price, close_price)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "low_price <= least(open_price, close_price)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "base_volume >= 0 and quote_volume >= 0 and trade_count >= 0"
      - dbt_utils.expression_is_true:
          name: binance_candles_are_full_hours
          arguments:
            expression: "is_full_candle"
          config:
            severity: warn
    columns:
      - name: symbol
        description: Binance trading pair, e.g. BTCUSDT.
        # "Is this a symbol we track?" is tested in CORE against dim_asset (relationships).
        data_tests:
          - not_null
      - name: interval_code
        description: Candle length. Only 1h in the MVP.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["1h"]
      - name: open_time
        description: Candle start, UTC.
        data_tests:
          - not_null
      - name: trade_date
        description: UTC calendar date of open_time. Crypto trades every day, weekends included.
        data_tests:
          - not_null
      - name: close_price
        data_tests:
          - not_null
      - name: is_full_candle
        description: False when the candle closed early (exchange halt) or has an odd close_time.

  - name: stg_fred_series
    description: FRED's own description of each series (title, units, frequency). One row per series.
    columns:
      - name: series_id
        data_tests: [unique, not_null]

  - name: stg_fred_observation
    description: >
      FRED values, one row per vintage. A vintage is the latest known value for its
      observation_date from realtime_start through realtime_end.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series_id, observation_date, realtime_start]
      - dbt_utils.expression_is_true:
          name: fred_values_published_after_the_day_they_describe
          arguments:
            expression: "realtime_start >= observation_date"
      - dbt_utils.expression_is_true:
          name: fred_vintage_periods_are_ordered
          arguments:
            expression: "realtime_end >= realtime_start"
      - dbt_utils.expression_is_true:
          name: fred_missing_values_are_dots
          arguments:
            expression: "is_missing = (value_raw = '.')"
    columns:
      - name: series_id
        description: FRED series, e.g. DGS10 (10-year Treasury yield), DFF (Fed Funds rate).
        # "Is this a series we track?" is tested in CORE against dim_macro_indicator.
        data_tests:
          - not_null
      - name: observation_date
        description: The day (or month) the value describes.
        data_tests:
          - not_null
      - name: realtime_start
        description: The day FRED published this value. Use it for point-in-time lookups.
        data_tests:
          - not_null
      - name: realtime_end
        description: Last day this vintage was the latest known value (9999-12-31 = still current).
      - name: value
        description: Numeric value; NULL when FRED had no value that day (value_raw = ".").

  - name: stg_defillama_chain_tvl
    description: >
      DefiLlama TVL per chain and day, one row per version. A version is the latest value
      DefiLlama gave for tvl_date from fetched_date through valid_to.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [chain, tvl_date, fetched_date]
      - dbt_utils.expression_is_true:
          name: defillama_values_are_fetched_after_their_day
          arguments:
            expression: "fetched_date > tvl_date"
      - dbt_utils.expression_is_true:
          name: defillama_tvl_is_positive
          arguments:
            expression: "tvl_usd > 0"
      - dbt_utils.expression_is_true:
          name: defillama_version_periods_are_ordered
          arguments:
            expression: "valid_to >= fetched_date"
    columns:
      - name: chain
        description: DefiLlama chain slug, e.g. Ethereum; "All" is every chain together.
        data_tests: [not_null]
      - name: tvl_date
        description: The UTC day the TVL describes (DefiLlama's 00:00 UTC point).
        data_tests: [not_null]
      - name: fetched_date
        description: The UTC day our pipeline fetched this value.
        data_tests: [not_null]
      - name: tvl_usd
        description: Total value locked in USD, DefiLlama method (no liquid staking, no double counting).
        data_tests: [not_null]
      - name: is_backfill
        description: True when the value came from the first, historical load of the chain.

