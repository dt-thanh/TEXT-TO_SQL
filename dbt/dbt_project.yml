# The dbt project: turns RAW tables into STAGING → CORE → MART with SQL SELECTs, and tests them.
# Run it through the Makefile (make dbt-build) so Snowflake settings are loaded from ../.env.
name: finsight
version: "1.0.0"
profile: finsight

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

# Reference CSVs (dbt/seeds/) are loaded next to the staging views.
seeds:
  finsight:
    +schema: staging

models:
  finsight:
    # Spec §9: STAGING only cleans and standardizes. Views are cheap and always show current RAW.
    staging:
      +schema: staging
      +materialized: view
    # Spec §10: reusable facts and dimensions. Tables, because every mart reads them repeatedly.
    # A model can override this (fct_crypto_kline_1h is incremental).
    core:
      +schema: core
      +materialized: table
    # Spec §11: business-ready tables that analysts and the Text-to-SQL agent query.
    # Only this schema is readable by FINSIGHT_AGENT (infra/snowflake/00_setup.sql, block 4b).
    marts:
      +schema: mart
      +materialized: table
      # Write the descriptions from _marts.yml into Snowflake as table/column COMMENTs.
      # The Text-to-SQL agent reads them from INFORMATION_SCHEMA to learn what each column means.
      +persist_docs:
        relation: true
        columns: true
